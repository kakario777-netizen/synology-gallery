name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 만들기
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SynoGallery-v0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SynoGallery-apk
          path: out/*.apk

      - name: 릴리스 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 시놀 갤러리 v0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
