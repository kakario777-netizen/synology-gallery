name: APK 빌드

on:
  # 앱 코드가 바뀐 푸시(=릴리스)와 수동 실행 때만 빌드. 설명 문서만 바뀌면 빌드 안 함.
  # 외부인의 풀 리퀘스트로는 실행되지 않음 (pull_request 트리거 없음)
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.jks

      - name: APK 만들기
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SynoGallery-v0.1.${{ github.run_number }}.apk

      - name: 릴리스 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 시놀 갤러리 v0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
